name: Build Native Test APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pobiera prawdziwy, oficjalny, wstepnie zbudowany plik JAR biblioteki java-lame
      # (czysty port LAME do Javy, potrzebny do kodowania MP3 bez C++/NDK).
      - name: Download java-lame JAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/net.sourceforge.lame-3.98.4.jar \
            https://github.com/nwaldispuehl/java-lame/releases/download/v3.98.4/net.sourceforge.lame-3.98.4.jar

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pitchrec-native-test-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
