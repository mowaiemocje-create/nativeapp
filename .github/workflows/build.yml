name: Build APK (kursanci) + AAB (Google Play)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pobiera prawdziwy, oficjalny, wstepnie zbudowany plik JAR biblioteki java-lame
      # (czysty port LAME do Javy, potrzebny do kodowania MP3 bez C++/NDK).
      - name: Download java-lame JAR
        run: |
          # JAR jest juz w repo (app/libs) — pobieramy tylko, gdy go brak albo jest uszkodzony
          mkdir -p app/libs
          J=app/libs/net.sourceforge.lame-3.98.4.jar
          if ! unzip -tq "$J" >/dev/null 2>&1; then
            curl -fL --retry 5 --retry-delay 5 -o "$J" \
              https://github.com/nwaldispuehl/java-lame/releases/download/v3.98.4/net.sourceforge.lame-3.98.4.jar
            unzip -tq "$J"
          fi

      # Staly klucz podpisu z sekretu (bez niego aktualizacje nie instaluja sie na istniejacej apce)
      - name: Signing key
        env:
          KS: ${{ secrets.APP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/ci.keystore; echo "HAS_KS=true" >> $GITHUB_ENV; else echo "HAS_KS=false" >> $GITHUB_ENV; fi

      # Dwie aplikacje naraz: APK dla kursantow + AAB do Sklepu Google Play
      - name: Build APK (kursanci) + AAB (Google Play)
        run: gradle assembleStudentsRelease bundlePlayRelease --no-daemon -PbuildNo=${{ github.run_number }}

      # Plik gotowy do wrzucenia na https://nowamowa.com/apka.apk (aplikacje same go pobiora)
      - name: Rename APK + AAB
        run: |
          cp app/build/outputs/apk/students/release/app-students-release.apk apka.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab new-speech-play.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apka-1.${{ github.run_number }}
          path: apka.apk

      # Do wgrania w Play Console (Testy -> Testy wewnetrzne -> Utworz wersje)
      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: play-aab-1.${{ github.run_number }}
          path: new-speech-play.aab
