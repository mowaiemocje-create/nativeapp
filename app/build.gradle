apply plugin: 'com.android.application'

android {
    namespace "com.pitchrec.nativetest"
    compileSdk 36

    defaultConfig {
        applicationId "com.pitchrec.nativetest"
        minSdkVersion 26
        targetSdkVersion 36
        // numer kompilacji z GitHub Actions (-PbuildNo=...) — rosnie przy kazdym pushu,
        // dzieki temu aplikacja wie, ze na serwerze jest nowsza wersja
        versionCode (project.hasProperty('buildNo') ? project.property('buildNo').toInteger() : 1)
        versionName (project.hasProperty('buildNo') ? "1." + project.property('buildNo') : "0.1-test")
    }

    buildFeatures {
        buildConfig true
    }

    // DWIE APLIKACJE z jednego kodu:
    //  - students: wersja dla kursantow (APK z nowamowa.com) — nagrywanie rozmow + samoaktualizacja.
    //    applicationId BEZ ZMIAN, wiec aktualizacje dalej instaluja sie na istniejacej aplikacji.
    //  - play: wersja do Sklepu Google Play (.aab) — bez nagrywania rozmow i bez samoaktualizacji
    //    (zasady Google Play). Inny applicationId, wiec obie moga byc na jednym telefonie.
    // Kod tylko dla jednej wersji: app/src/students/... albo app/src/play/...
    flavorDimensions = ["dist"]
    productFlavors {
        students {
            dimension "dist"
            applicationId "com.pitchrec.nativetest"
            buildConfigField "boolean", "PLAY", "false"
        }
        play {
            dimension "dist"
            applicationId "com.nowamowa.newspeech"
            buildConfigField "boolean", "PLAY", "true"
        }
    }

    // STALY klucz podpisu (sekret APP_KEYSTORE_B64 w GitHub). Bez stalego klucza kazda kompilacja
    // ma inny podpis i Android nie pozwala zainstalowac aktualizacji na istniejacej aplikacji.
    signingConfigs {
        fixed {
            storeFile file("ci.keystore")
            storePassword "newspeech-app"
            keyAlias "newspeech"
            keyPassword "newspeech-app"
        }
    }

    buildTypes {
        debug {
            if (file("ci.keystore").exists()) signingConfig signingConfigs.fixed
        }
        // WYDANIE: kursanci (APK) — ten sam staly klucz co wczesniej. Play (.aab) jest podpisany tym samym
        // kluczem, ktory w Google Play sluzy jako "klucz przesylania" (Google podpisuje apke wlasnym kluczem).
        // Kursanci: ten sam staly klucz co wczesniej, wiec aktualizacja
        // instaluje sie na istniejacej aplikacji. Wersja "debug" (debuggable) jest czesciej
        // blokowana przez Play Protect i skanery producentow (Samsung, Xiaomi).
        release {
            minifyEnabled false
            debuggable false
            if (file("ci.keystore").exists()) signingConfig signingConfigs.fixed
        }
    }

    // kontrola "lint" przy wydaniu nie moze zatrzymac kompilacji w GitHub Actions
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation('androidx.appcompat:appcompat:1.7.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation 'androidx.core:core:1.13.1'
    implementation files('libs/net.sourceforge.lame-3.98.4.jar')
    // Zakup "pełna wersja" — tylko wersja Google Play (kursanci maja wszystko bez zakupu)
    playImplementation 'com.android.billingclient:billing:8.0.0'
}
