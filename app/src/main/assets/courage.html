function fxT(k,a){var l=FX_TR[curLang]?curLang:'en';var s=(FX_TR[l]&&FX_TR[l][k])||FX_TR.pl[k]||k;if(a!=null){if(!Array.isArray(a))a=[a];a.forEach(function(v,i){s=s.split('{'+i+'}').join(v);});}return s;}
function escH(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fxQS(){return CFG.auth;}
function fxGet(path){return fetch(path+(path.indexOf('?')>=0?'&':'?')+fxQS(),{cache:'no-store'}).then(function(r){return r.json();});}
function fxPost(path,body){var b={};CFG.auth.split('&').forEach(function(kv){var i=kv.indexOf('=');b[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign(b,body||{}))}).then(function(r){return r.json();});}
function scRemove(id,after){if(!confirm(fxT('rmSure')))return;fxPost('/showcase/remove',{id:Number(id)}).then(function(r){if(r&&r.ok){if(scFeed&&scFeed.items)scFeed.items=scFeed.items.filter(function(x){return x.id!==Number(id);});if(after)after();}else alert('❌ '+((r&&(r.error||r.message))||'Błąd'));}).catch(function(){alert('❌ '+fxT('loadErr'));});}
var FX_BTN='border:none;border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation';

function scAudioUrl(a){return a?VOICE_REVIEW_BASE+a+(a.indexOf('?')>=0?'&':'?')+fxQS():'';}
function scBare(t){return String(t||'').replace(/^[^\p{L}\p{N}]+/u,'');}
function scIcon(it){return SC_ICON[it.kind]||(String(it.kind_label||'').split(' ')[0])||'🎧';}
function scLoadLeaflet(cb){
  if(window.L&&window.L.map&&(window.L.markerClusterGroup||window._scNoCluster))return cb();
  var CDN='https://cdnjs.cloudflare.com/ajax/libs/';
  var css=function(id,href){if(!document.getElementById(id)){var l=document.createElement('link');l.id=id;l.rel='stylesheet';l.href=href;document.head.appendChild(l);}};
  var js=function(src,ok,bad){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s);};
  css('leafletCss',CDN+'leaflet/1.9.4/leaflet.min.css');
  css('mcCss',CDN+'leaflet.markercluster/1.5.3/MarkerCluster.min.css');
  css('mcCss2',CDN+'leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css');
  var withCluster=function(){
    if(window.L.markerClusterGroup)return cb();
    js(CDN+'leaflet.markercluster/1.5.3/leaflet.markercluster.min.js',function(){cb();},function(){window._scNoCluster=true;cb();}); // bez grupowania też działa
  };
  if(window.L&&window.L.map)return withCluster();
  js(CDN+'leaflet/1.9.4/leaflet.min.js',withCluster,function(){cb(new Error('leaflet'));});
}
var scMarkers={},scView='map';
var SC_SCROLL='display:flex;align-items:flex-start;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px';
function scOpenMap(){
  var el=document.getElementById('scOv');
  if(!el){el=document.createElement('div');el.id='scOv';document.body.appendChild(el);}
  el.style.cssText='position:fixed;inset:0;z-index:8500;background:#fff;display:flex;flex-direction:column';
  el.innerHTML='<div style="padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;border-bottom:1px solid var(--bd,#eee);display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-weight:900;font-size:17px">'+fxT('scTitle')+'</div><div style="font-size:12px;color:var(--acc,#E8820C);font-weight:700">'+fxT('slogan')+'</div></div><button onclick="scCloseMap()" style="background:none;border:none;font-size:24px;color:var(--mu);cursor:pointer;padding:4px 8px">✕</button></div>'
    +'<div style="display:flex;gap:6px;padding:8px 12px 0;flex-shrink:0"><button id="scVMap" class="scV" data-v="map"></button><button id="scVList" class="scV" data-v="list"></button></div>'
    +'<div id="scFilters" style="display:flex;gap:6px;overflow-x:auto;padding:8px 12px;flex-shrink:0"></div>'
    +'<div id="scScroll" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch"><div id="scNew"></div><div id="scMapDiv" style="height:46vh;min-height:240px;background:#e8eef2"></div><div id="scDetail"></div><div id="scList" style="padding:4px 12px 30px"></div></div>';
  document.getElementById('scList').innerHTML='<div style="padding:16px;color:var(--mu)">'+fxT('loading')+'</div>';
  scMap=null;scMarkers={};scView='map';
  el.querySelectorAll('.scV').forEach(function(b){b.onclick=function(){scView=b.dataset.v;scApplyView();};});
  scApplyView();
  fxGet('/showcase/feed').then(function(d){
    if(!d||!d.ok){document.getElementById('scList').innerHTML='<div style="padding:16px;color:var(--mu)">'+fxT('loadErr')+'</div>';return;}
    scFeed=d;scKind='';scRender();
  }).catch(function(){var l=document.getElementById('scList');if(l)l.innerHTML='<div style="padding:16px;color:var(--mu)">'+fxT('loadErr')+'</div>';});
}
// przełącznik 🗺 Mapa / 📋 Lista
function scApplyView(){
  var on=function(id,yes,label){var b=document.getElementById(id);if(!b)return;b.textContent=label;b.style.cssText='flex:1;border:1.5px solid var(--acc,#E8820C);border-radius:10px;padding:7px;font-size:13px;font-weight:800;cursor:pointer;background:'+(yes?'var(--acc,#E8820C)':'#fff')+';color:'+(yes?'#fff':'var(--acc,#E8820C)');};
  on('scVMap',scView==='map',fxT('vMap'));on('scVList',scView==='list',fxT('vList'));
  var md=document.getElementById('scMapDiv');if(md)md.style.display=scView==='map'?'block':'none';
  if(scView==='map'&&scMap)setTimeout(function(){try{scMap.invalidateSize();}catch(e){}},50);
}
function scCloseMap(){var el=document.getElementById('scOv');if(el){el.querySelectorAll('audio').forEach(function(a){try{a.pause();}catch(e){}});el.remove();}scMap=null;}
// 🎬 film: YouTube albo TikTok (pola video_src / video_id / thumb / embed / video_url z workera; stare youtube_id też działa)
function scVid(it){return !!(it&&(it.video_url||it.embed||it.youtube_id));}
function scVidSrc(it){return it.video_src||(it.youtube_id?'youtube':null);}
function scThumb(it,small){
  var t=it.thumb||(it.youtube_id?'https://img.youtube.com/vi/'+encodeURIComponent(it.youtube_id)+'/mqdefault.jpg':'');
  if(t&&t.charAt(0)==='/')t=VOICE_REVIEW_BASE+t; // TikTok — miniatura trzymana u nas
  if(small&&scVidSrc(it)==='youtube')t=t.replace('/mqdefault.jpg','/default.jpg');
  return t;
}
function scEmbed(it){return it.embed||(it.youtube_id?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(it.youtube_id):'');}
function scVidUrl(it){return it.video_url||it.youtube||'';}
// znaczek na miniaturze: YouTube czerwony ▶, TikTok czarne kółko ♪
function scBadge(it,big){
  if(scVidSrc(it)==='tiktok')return '<span style="background:#000;color:#fff;border-radius:50%;width:'+(big?28:16)+'px;height:'+(big?28:16)+'px;display:inline-flex;align-items:center;justify-content:center;font-size:'+(big?16:10)+'px;border:1.5px solid #fff">♪</span>';
  return '<span style="background:#e53935;color:#fff;border-radius:'+(big?8:5)+'px;padding:'+(big?'2px 9px':'0 5px')+';font-size:'+(big?14:11)+'px;line-height:'+(big?'normal':'15px')+'">▶</span>';
}
function scThumbBox(it,w,h,big){
  var t=scThumb(it,!big);
  return '<div style="position:relative;width:'+w+';height:'+h+';border-radius:'+(big?8:7)+'px;overflow:hidden;background:#000'+(big?'':';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)')+'">'
    +(t?'<img src="'+escH(t)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">':'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:'+(big?30:16)+'px">🎬</div>')
    +'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">'+scBadge(it,big)+'</div>';
}
// kafelek: film = miniatura z ▶, nagranie = ikona rodzaju
function scTile(it){
  var pic=scVid(it)
    ?scThumbBox(it,'120px','68px',true)+(it.audio?'<span style="position:absolute;right:3px;bottom:3px;background:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px">'+scIcon(it)+'</span>':'')+'</div>'
    :'<div style="width:120px;height:68px;border-radius:8px;background:#fff4e6;display:flex;align-items:center;justify-content:center;font-size:34px">'+scIcon(it)+'</div>';
  return '<button data-id="'+it.id+'" class="scPick" style="flex-shrink:0;width:124px;text-align:left;border:none;background:none;padding:2px;cursor:pointer">'+pic
    +'<div style="font-size:12px;font-weight:700;line-height:1.25;margin-top:4px;max-height:30px;overflow:hidden">'+escH(scBare(it.title||it.kind_label||''))+'</div>'
    +'<div style="font-size:10px;color:var(--mu)">'+escH(it.display_name||'')+(it.mine?' · '+fxT('mine'):'')+'</div></button>';
}
function scRender(){
  var items=(scFeed&&scFeed.items)||[];
  var kinds={};items.forEach(function(it){kinds[it.kind]=1;});
  var f=document.getElementById('scFilters');if(!f)return;
  var chip=function(k,label){return '<button data-k="'+k+'" style="flex-shrink:0;border:1px solid '+(scKind===k?'var(--acc,#E8820C)':'var(--bd,#ddd)')+';background:'+(scKind===k?'#fff4e6':'#fff')+';border-radius:16px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">'+label+'</button>';};
  f.innerHTML=chip('',fxT('all'))+Object.keys(kinds).map(function(k){return chip(k,(SC_ICON[k]||'🎧'));}).join('');
  f.querySelectorAll('button').forEach(function(b){b.onclick=function(){scKind=b.dataset.k;scRender();};});
  var vis=items.filter(function(it){return !scKind||it.kind===scKind;});
  var weekAgo=Date.now()/1000-7*86400;
  var nw=vis.filter(function(it){return it.created_at>weekAgo;});
  var ne=document.getElementById('scNew');
  ne.innerHTML=nw.length?'<div style="padding:8px 12px"><div style="font-size:12px;font-weight:800;margin-bottom:6px">'+fxT('newWeek')+'</div><div style="'+SC_SCROLL+'">'+nw.map(scTile).join('')+'</div></div>':'';
  var list=document.getElementById('scList');
  if(!items.length){list.innerHTML='<div style="padding:16px;color:var(--mu)">'+fxT('empty')+'</div>';}
  else{
    // kafelki pogrupowane wg miejscowości: „📍 Mikołów (4)”
    var groups={},order=[];
    vis.forEach(function(it){var k=(it.place||'').trim()||'—';if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(it);});
    order.sort(function(a,b){if(a==='—')return 1;if(b==='—')return -1;return groups[b].length-groups[a].length||a.localeCompare(b);});
    list.innerHTML=order.map(function(k){
      return '<div style="margin-top:12px"><div style="font-size:13px;font-weight:800;margin-bottom:6px">📍 '+(k==='—'?escH(fxT('noTown')):escH(k))+' ('+groups[k].length+')</div><div style="'+SC_SCROLL+'">'+groups[k].map(scTile).join('')+'</div></div>';
    }).join('');
  }
  document.querySelectorAll('#scOv .scPick').forEach(function(b){b.onclick=function(){scFocus(Number(b.dataset.id));};});
  scDrawMap(vis);
}
// znacznik: film = miniatura YouTube z czerwonym ▶, nagranie = okrągła ikona rodzaju
function scMarkerIcon(it){
  if(scVid(it)){var tk=scVidSrc(it)==='tiktok';return L.divIcon({className:'',iconSize:tk?[36,50]:[52,40],iconAnchor:tk?[18,25]:[26,20],html:scThumbBox(it,tk?'32px':'48px',tk?'46px':'36px',false)+'</div>'});}
  return L.divIcon({className:'',iconSize:[36,36],iconAnchor:[18,18],
    html:'<div style="width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--acc,#E8820C);box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:18px">'+scIcon(it)+'</div>'});
}
// grupa pinezek: „5 · 🍔🎬🚶”
function scClusterIcon(cl){
  var ms=cl.getAllChildMarkers(),seen=[],n=ms.length;
  ms.forEach(function(m){var ic=m.options._sc?(scVid(m.options._sc)?'🎬':scIcon(m.options._sc)):'';if(ic&&seen.indexOf(ic)<0&&seen.length<3)seen.push(ic);});
  return L.divIcon({className:'',iconSize:[74,34],iconAnchor:[37,17],
    html:'<div style="display:inline-flex;align-items:center;gap:3px;background:var(--acc,#E8820C);color:#fff;border:2px solid #fff;border-radius:17px;padding:3px 9px;font-weight:900;font-size:13px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.45)">'+n+' · <span style="font-size:14px">'+seen.join('')+'</span></div>'});
}
function scDrawMap(vis){
  var pos=vis.filter(function(it){return it.lat!=null&&it.lng!=null;});
  var md=document.getElementById('scMapDiv');if(!md)return;
  scLoadLeaflet(function(err){
    if(err||!document.getElementById('scMapDiv')){if(md)md.style.display='none';return;}
    if(!scMap){
      scMap=L.map(md,{zoomControl:true,attributionControl:true}).setView([50.17,18.9],6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(scMap);
    }
    if(scLayer)scLayer.remove();
    scLayer=L.markerClusterGroup?L.markerClusterGroup({maxClusterRadius:45,showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:scClusterIcon}):L.layerGroup();
    scLayer.addTo(scMap);
    scMarkers={};
    var pts=[];
    pos.forEach(function(it){
      var m=L.marker([it.lat,it.lng],{icon:scMarkerIcon(it),_sc:it,title:scBare(it.title||'')});
      m.on('click',function(){scShow(it.id);});
      scLayer.addLayer(m);scMarkers[it.id]=m;
      pts.push([it.lat,it.lng]);
    });
    if(pts.length===1)scMap.setView(pts[0],11);else if(pts.length>1)scMap.fitBounds(pts,{padding:[30,30],maxZoom:12});
    setTimeout(function(){try{scMap.invalidateSize();}catch(e){}},200);
  });
}
// dotknięcie kafelka: przybliż mapę do pinezki i otwórz odtwarzacz
function scFocus(id){
  var m=scMarkers[id];
  if(m&&scMap&&scView==='map'){
    var md=document.getElementById('scMapDiv');if(md)md.scrollIntoView({behavior:'smooth',block:'start'});
    var go=function(){try{scMap.setView(m.getLatLng(),Math.max(scMap.getZoom(),14));}catch(e){}};
    if(scLayer&&scLayer.zoomToShowLayer)scLayer.zoomToShowLayer(m,go);else go();
  }
  setTimeout(function(){scShow(id);},m&&scView==='map'?450:0);
}
function scShow(id){
  var it=((scFeed&&scFeed.items)||[]).filter(function(x){return x.id===id;})[0];if(!it)return;
  var dt=document.getElementById('scDetail');if(!dt)return;
  var head=escH(it.kind_label||'')+(it.display_name?' · '+escH(it.display_name):'')+(it.place?' · '+escH(it.place):'')+(it.system?' · '+fxT('system')+' '+escH(it.system):'');
  var h='<div style="margin:10px 12px;border:2px solid var(--acc,#E8820C);border-radius:14px;padding:12px;background:#fffaf3">'
   +'<div style="display:flex;justify-content:space-between;gap:8px"><div style="font-weight:800;font-size:14px">'+head+'</div><button onclick="document.getElementById(\'scDetail\').innerHTML=\'\'" style="background:none;border:none;font-size:18px;color:var(--mu);cursor:pointer">✕</button></div>'
   +(it.title&&it.title!==it.kind_label?'<div style="font-size:13px;margin-top:2px">'+escH(it.title)+'</div>':'')
   +(it.note?'<div style="font-size:13px;margin-top:8px;background:#fff;border-radius:8px;padding:8px">💬 '+escH(it.note)+'</div>':'')
   +'<div style="font-size:12px;color:var(--acc,#E8820C);font-weight:700;margin-top:8px">'+fxT('slogan')+'</div>';
  if(it.audio)h+='<audio id="scAud" controls preload="none" src="'+escH(scAudioUrl(it.audio))+'" style="width:100%;margin-top:8px"></audio>';
  if(scVid(it)){
    var tk=scVidSrc(it)==='tiktok',emb=scEmbed(it),vu=scVidUrl(it);
    if(emb)h+='<div id="scYt" style="position:relative;margin:8px auto 0;border-radius:10px;overflow:hidden;cursor:pointer;background:#000;'+(tk?'aspect-ratio:9/16;max-width:300px;width:100%':'aspect-ratio:16/9')+'">'
      +(scThumb(it)?'<img src="'+escH(scThumb(it))+'" alt="" style="width:100%;height:100%;object-fit:cover;opacity:.85">':'')+'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:scale(2.2)">'+scBadge(it,true)+'</div></div>';
    if(vu)h+='<a href="'+escH(vu)+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:'+(tk?'#000':'#c4302b')+'">'+fxT(tk?'ttOpen':'ytOpen')+'</a>';
  }
  if(it.mine)h+='<button id="scRmMine" style="'+FX_BTN+';width:100%;margin-top:8px;background:#fdecea;color:#c62828">'+fxT('rmMap')+'</button>';
  h+='<button id="scRecMine" style="'+FX_BTN+';width:100%;margin-top:10px;background:var(--acc,#E8820C);color:#fff;'+(it.audio?'display:none':'')+'">'+fxT('recYours')+'</button></div>';
  dt.innerHTML=h;
  var yt=document.getElementById('scYt');
  if(yt)yt.onclick=function(){var emb=scEmbed(it);yt.innerHTML='<iframe src="'+escH(emb+(scVidSrc(it)==='youtube'?(emb.indexOf('?')>=0?'&':'?')+'autoplay=1':''))+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="width:100%;height:100%;border:0"></iframe>';var rb=document.getElementById('scRecMine');if(rb)rb.style.display='block';};
  var au=document.getElementById('scAud');
  if(au){au.addEventListener('play',function(){var rb=document.getElementById('scRecMine');if(rb)rb.style.display='block';});au.addEventListener('ended',function(){var rb=document.getElementById('scRecMine');if(rb)rb.style.display='block';});}
  document.getElementById('scRecMine').onclick=function(){scRecordMine(it);};
  var _rm=document.getElementById('scRmMine');if(_rm)_rm.onclick=function(){scRemove(it.id,function(){var d2=document.getElementById('scDetail');if(d2)d2.innerHTML='';scRender();});};
  dt.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function scRecordMine(it){try{PitchRecApp.recordMine(it.category||'');}catch(e){}}
scCloseMap=function(){try{PitchRecApp.close();}catch(e){}};
scOpenMap();
</script></body></html>
